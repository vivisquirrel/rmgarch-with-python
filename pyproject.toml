[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rmgarchpy"
version = "0.1.0"
description = "Python port of the R rmgarch package: DCC-GARCH, dynamic copula cGARCH, GO-GARCH, mdcopula"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "rmgarchpy contributors" }]
keywords = ["finance", "garch", "dcc", "copula", "quant"]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "pandas>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["rmgarchpy*"]